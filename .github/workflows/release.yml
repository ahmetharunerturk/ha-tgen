name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag and build integration ZIP
        run: |
          python - <<'PY'
          import json, os, pathlib, zipfile
          manifest = json.loads(pathlib.Path('custom_components/ha_tgen/manifest.json').read_text())
          assert os.environ['GITHUB_REF_NAME'] == 'v' + manifest['version']
          with zipfile.ZipFile('ha_tgen.zip', 'w', zipfile.ZIP_DEFLATED) as package:
              for path in pathlib.Path('custom_components/ha_tgen').rglob('*'):
                  if path.is_file() and '__pycache__' not in path.parts:
                      package.write(path, path)
          PY
      - name: Publish validated GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ha_tgen.zip --title "HA Timelapse Generator $GITHUB_REF_NAME" --notes-file docs/release-notes.md
